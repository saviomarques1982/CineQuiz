  <style>
    body {
      font-family: sans-serif;
      background: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 100px;
    }

    img.logo {
      width: 150px;
      margin-bottom: 20px;
    }

    .quiz-container {
      max-width: 400px;
      width: 100%;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .question-image {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .options button, .restart-btn, .share-btn {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #292929;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .options button:hover, .restart-btn:hover, .share-btn:hover {
      background: #444;
    }

    .options button.correct {
      background: green;
    }

    .options button.wrong {
      background: red;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

    let current = 0;
    let chances = 3;

    const img = document.getElementById("questionImage");
    const optionsContainer = document.getElementById("optionsContainer");
    const status = document.getElementById("status");
    const restartBtn = document.getElementById("restartBtn");
    const shareBtn = document.getElementById("shareBtn");

    function loadQuestion() {
      const q = quiz[current];
      img.src = q.imageSrc;
      optionsContainer.innerHTML = "";
      restartBtn.classList.add("hidden");
      shareBtn.classList.add("hidden");
      status.textContent = `Chances restantes: ${chances}`;
      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => handleAnswer(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selected) {
      const q = quiz[current];
      const buttons = optionsContainer.querySelectorAll("button");

      if (selected === q.correctAnswerIndex) {
        buttons[selected].classList.add("correct");
        status.textContent = "Correto! Próxima pergunta...";
        setTimeout(() => {
          current++;
          if (current < quiz.length) {
            loadQuestion();
          } else {
            status.textContent = "🎉 Parabéns! Você completou o CineQuiz!";
            optionsContainer.innerHTML = "";
            shareBtn.classList.remove("hidden");
			  // Final do jogo com sucesso
            status.textContent = "🎉 Parabéns! Você completou o CineQuiz!";
            optionsContainer.innerHTML = "";
            img.src = "https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExYXJiczVtamJjaHc3NnVxeGRobndvcm9rZThjanR2aXJzY3Ezb3AwMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/Zd5widi4dgNrxwhxbk/giphy.gif"; // Mostra imagem de vitória
            shareBtn.classList.remove("hidden");
          }
        }, 1000);
      } else {
        buttons[selected].classList.add("wrong");
        chances--;
        if (chances === 0) {
          status.textContent = "❌ Você perdeu todas as chances!";
          optionsContainer.innerHTML = "";
          restartBtn.classList.remove("hidden");
        } else {
          status.textContent = `Errado! Restam ${chances} chance(s).`;
        }
      }
    }

    restartBtn.onclick = () => {
      current = 0;
      chances = 3;
      loadQuestion();
    };

    shareBtn.onclick = () => {
      const url = window.location.href;
      const msg = "🚀 Tente completar o CineQuiz! Acesse: " + url;

      if (navigator.share) {
        navigator.share({
          title: "CineQuiz",
          text: msg,
          url: url
        }).catch(err => console.error("Erro ao compartilhar:", err));
      } else {
        alert("Copie este link para compartilhar:\n\n" + url);
      }
    };
